name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish when this version is new
        run: |
          VERSION=$(node -p "require('./packages/workout-guide/package.json').version")
          if npm view "@bryllim/workout-guide@$VERSION" version >/dev/null 2>&1; then
            echo "@bryllim/workout-guide@$VERSION is already published."
          else
            npm publish -w @bryllim/workout-guide --access public --provenance
          fi
