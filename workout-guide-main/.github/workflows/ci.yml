name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run site:validate
      - run: npm run pack:dry
      - run: npm run test:consumers
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
